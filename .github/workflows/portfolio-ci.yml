name: Portfolio CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  portfolio-quality-gate:
    name: Documentation, architecture, JSON-RPC, policy, audit, and portfolio quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required portfolio files
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/architecture/mcp-shield-architecture.svg
          test -f docs/one-pagers/ai-security-mcp-shield.md
          test -f docs/github-profile-readme-template.md
          test -f packages/policy/src/engine.ts
          test -f packages/policy/src/parser.ts
          test -f packages/shared/src/jsonrpc.ts
          test -f packages/audit/src/events.ts
          test -f tests/unit/policy-engine.test.ts
          test -f tests/unit/jsonrpc-contract.test.ts
          test -f tests/unit/policy-parser-audit.test.ts

      - name: Check README sections
        run: |
          set -euo pipefail
          grep -qi "Problem statement" README.md
          grep -qi "Architecture" README.md
          grep -qi "Test strategy" README.md
          grep -qi "Failure modes" README.md
          grep -qi "Roadmap" README.md

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Run real MCP unit and contract tests
        run: npx vitest run tests/unit/policy-engine.test.ts tests/unit/jsonrpc-contract.test.ts tests/unit/policy-parser-audit.test.ts --reporter=verbose

      - name: Generate portfolio test report
        run: |
          mkdir -p reports
          cat > reports/portfolio-ci-report.md <<'REPORT'
          # Portfolio CI Report — MCP Shield

          ## Scope

          This CI gate validates portfolio readiness and real tested security slices.

          ## Checks

          - README exists.
          - Architecture SVG exists.
          - AI security one-pager exists.
          - GitHub profile README template exists.
          - README includes problem statement, architecture, test strategy, failure modes, and roadmap.
          - Policy engine source and tests exist.
          - JSON-RPC/MCP contract source and tests exist.
          - Policy parser source and tests exist.
          - Audit event source and tests exist.
          - Vitest runs policy-engine tests for allow, block, approval, precedence, and redaction behavior.
          - Vitest runs JSON-RPC contract tests for request validation, MCP tools/call detection, extraction, and malformed params.
          - Vitest runs parser/audit tests for YAML-lite policies, JSON policies, validation failures, and redacted audit events.

          ## Current honest limitation

          This is not yet a full MCP proxy end-to-end test. It now covers deterministic policy evaluation, secret redaction, JSON-RPC/MCP tool-call contract validation, policy parsing, and audit event construction.
          REPORT

      - name: Upload portfolio report
        uses: actions/upload-artifact@v4
        with:
          name: mcp-shield-portfolio-ci-report
          path: reports/portfolio-ci-report.md
