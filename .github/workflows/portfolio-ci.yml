name: Portfolio CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  portfolio-quality-gate:
    name: Documentation, architecture, and portfolio quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required portfolio files
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/architecture/mcp-shield-architecture.svg
          test -f docs/one-pagers/ai-security-mcp-shield.md
          test -f docs/github-profile-readme-template.md
          test -f packages/policy/src/engine.ts
          test -f tests/unit/policy-engine.test.ts

      - name: Check README sections
        run: |
          set -euo pipefail
          grep -qi "Problem statement" README.md
          grep -qi "Architecture" README.md
          grep -qi "Test strategy" README.md
          grep -qi "Failure modes" README.md
          grep -qi "Roadmap" README.md

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Run real policy engine unit tests
        run: npx vitest run tests/unit/policy-engine.test.ts --reporter=verbose

      - name: Generate portfolio test report
        run: |
          mkdir -p reports
          cat > reports/portfolio-ci-report.md <<'REPORT'
          # Portfolio CI Report — MCP Shield

          ## Scope

          This CI gate validates both portfolio readiness and the first real runtime-security unit tests.

          ## Checks

          - README exists.
          - Architecture SVG exists.
          - AI security one-pager exists.
          - GitHub profile README template exists.
          - README includes problem statement, architecture, test strategy, failure modes, and roadmap.
          - Policy engine source exists.
          - Policy engine unit tests exist.
          - Vitest runs policy-engine tests for allow, block, approval, precedence, and redaction behavior.

          ## Current honest limitation

          This is not yet a full MCP proxy end-to-end test. It is the first real tested security slice: deterministic policy evaluation and secret redaction.
          REPORT

      - name: Upload portfolio report
        uses: actions/upload-artifact@v4
        with:
          name: mcp-shield-portfolio-ci-report
          path: reports/portfolio-ci-report.md
