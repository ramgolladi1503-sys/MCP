name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - hardening/mvp-completion-clean

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Corpus tests
        run: pnpm test:corpus

      - name: Integration tests
        run: pnpm test:integration

      - name: Scanner smoke test
        run: pnpm --filter @mcp-shield/cli dev -- scan examples/mcp-configs/unsafe-demo.json || test $? -eq 2

      - name: Policy smoke test
        run: pnpm --filter @mcp-shield/cli dev -- policy check examples/policies/coding-agent.yaml
