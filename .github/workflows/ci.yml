name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test:
    name: MCP Shield MVP quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable pnpm with Corepack
        run: corepack enable

      - name: Print tool versions
        run: |
          node --version
          corepack --version
          pnpm --version

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Print TypeScript config diagnostics
        run: |
          echo "--- tsconfig.base.json ---"
          cat tsconfig.base.json
          echo "--- tsconfig.build.json ---"
          cat tsconfig.build.json
          echo "--- resolved shared config ---"
          pnpm exec tsc --showConfig -p packages/shared/tsconfig.json | head -120

      - name: Typecheck
        run: pnpm exec tsc -b tsconfig.build.json --pretty false

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Corpus tests
        run: pnpm test:corpus

      - name: Integration tests
        run: pnpm test:integration

      - name: Scanner smoke test
        run: |
          set +e
          pnpm --filter @mcp-shield/cli dev -- scan examples/mcp-configs/unsafe-demo.json
          code=$?
          if [ "$code" -ne 2 ]; then
            echo "Expected scanner to exit 2 for unsafe-demo.json, got $code"
            exit 1
          fi

      - name: Policy smoke test
        run: pnpm --filter @mcp-shield/cli dev -- policy check examples/policies/coding-agent.yaml
