name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-release-gate:
    name: MCP Shield build, hardening, and release gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Print tool versions
        run: |
          node --version
          pnpm --version

      - name: Install with locked dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run hardening test suite
        run: pnpm test:hardening

      - name: Smoke built CLI binary
        run: |
          set -euo pipefail
          node packages/cli/dist/index.js --help
          node packages/cli/dist/index.js policy check examples/policies/coding-agent.yaml

      - name: Validate CLI release tarball contents
        run: |
          set -euo pipefail
          package_dir="$(mktemp -d)"
          (
            cd packages/cli
            pnpm pack --pack-destination "$package_dir"
          )
          package_file="$(find "$package_dir" -name '*.tgz' -print -quit)"
          test -n "$package_file"
          manifest="$package_dir/tarball-files.txt"
          tar -tf "$package_file" > "$manifest"
          grep -qx 'package/package.json' "$manifest"
          grep -qx 'package/dist/index.js' "$manifest"
          grep -qx 'package/dist/index.d.ts' "$manifest"

      - name: Run guarded publish dry-run
        run: pnpm release:dry-run

      - name: Verify unsafe scanner exit contract
        run: |
          set +e
          node packages/cli/dist/index.js scan examples/mcp-configs/unsafe-demo.json
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "Expected scanner to exit 2 for unsafe-demo.json, got $code"
            exit 1
          fi
