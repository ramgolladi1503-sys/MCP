schema_version: "1.0"
profile: algotradify

metadata:
  product: Algotradify
  category: Event-Sourced Paper Trading Agent Review Adapter
  purpose: Provide a starter Agent Review config for event-sourced paper-trading repositories that require journal-is-truth proof, reducer-derived state proof, strict paper/live boundaries, and evidence-backed acceptance proof.

required_sections:
  - Agent Work Contract
  - Grill Me Review
  - Hermes Review
  - GSD Review
  - Security Review
  - QA / Failure Review
  - Scope Guard
  - Acceptance Proof
  - Runtime Proof Required After Merge
  - What This PR Does Not Prove
  - Human Approval

required_evidence_contract_fields:
  - mode
  - candidate_id
  - decision
  - reason
  - is_runtime_change
  - is_security_runtime_change
  - child_mcp_forwarding_changed
  - policy_behavior_changed
  - approval_behavior_changed
  - audit_schema_changed
  - source

optional_evidence_contract_fields:
  - trace_behavior_changed
  - scanner_behavior_changed
  - cli_behavior_changed
  - config_adapter_behavior_changed
  - release_behavior_changed
  - ci_behavior_changed

modes:
  DOCS_ONLY:
    runtime_changes_allowed: false
    product_tests_required: false
    must_state_no_runtime_claims: true
  CONTRACT_ONLY:
    runtime_changes_allowed: false
    product_tests_required: false
    must_state_future_runtime_proof: true
  RUNTIME_CHANGE:
    runtime_changes_allowed: true
    product_tests_required: true
    must_include_negative_tests: true
  SECURITY_RUNTIME_CHANGE:
    runtime_changes_allowed: true
    product_tests_required: true
    must_include_negative_tests: true
    must_include_false_positive_tests: true
    must_include_audit_or_debug_evidence: true

hard_rules:
  no_fake_progress: true
  no_unrelated_abstractions: true
  no_test_weakening: true
  no_scope_creep: true
  no_runtime_claims_from_docs_only_pr: true
  no_unreviewed_ci_changes: true
  no_unreviewed_release_changes: true
  no_live_execution_before_approved_phase: true
  no_broker_adapter_change_without_explicit_scope: true
  no_new_strategy_provider_without_roadmap_scope: true
  no_ml_ranker_without_expectancy_proof: true
  journal_is_truth: true
  reducer_derives_state: true

runtime_safety_rules:
  fail_closed_on_invalid_config: true
  fail_closed_on_invalid_evidence: true
  fail_closed_on_missing_required_proof: true
  never_hide_validation_failures: true
  never_claim_runtime_safety_without_tests: true
  strict_paper_live_boundary_required: true
  journal_append_must_be_explicit: true
  reducer_replay_must_be_deterministic: true
  order_action_claims_require_acceptance_proof: true

area_rules:
  journal:
    path_patterns:
      - "paper/**/journal/**"
      - "runtime/**/journal/**"
      - "core/**/journal/**"
      - "**/*journal*.py"
      - "**/*event*.py"
    required_proof:
      - journal is truth proof
      - append-only proof
      - event schema proof
      - replay compatibility proof
    required_sections:
      - QA / Failure Review
      - Scope Guard
      - Acceptance Proof
  reducer:
    path_patterns:
      - "paper/**/reducer/**"
      - "core/**/reducer/**"
      - "**/*reducer*.py"
      - "**/*state*.py"
    required_proof:
      - reducer derives state proof
      - deterministic replay proof
      - invalid-event rejection proof
      - no hidden mutable state proof
    required_sections:
      - QA / Failure Review
      - Acceptance Proof
  paper_trading:
    path_patterns:
      - "paper/**"
      - "sim/**"
      - "simulation/**"
      - "runtime/paper/**"
    required_proof:
      - paper execution proof
      - no live order path proof
      - paper-live boundary proof
      - duplicate-action prevention proof
    required_sections:
      - Security Review
      - QA / Failure Review
      - Human Approval
  strategy:
    path_patterns:
      - "strategies/**"
      - "providers/**"
      - "signals/**"
      - "ml/**"
      - "models/**"
    required_proof:
      - strategy behavior proof
      - no new provider without roadmap scope
      - expectancy evidence proof
      - no profitability claim without evidence
    required_sections:
      - QA / Failure Review
      - Scope Guard
  risk:
    path_patterns:
      - "risk/**"
      - "core/risk/**"
      - "guards/**"
      - "safety/**"
      - "**/*risk*.py"
    required_proof:
      - risk rejection proof
      - fail-closed proof
      - boundary-condition proof
      - no test weakening
    required_sections:
      - Security Review
      - QA / Failure Review
  evidence:
    path_patterns:
      - "evidence/**"
      - "reports/**"
      - "replay/**"
      - "runtime/replay/**"
      - "runtime/evidence/**"
    required_proof:
      - acceptance proof
      - replay query proof
      - read-only evidence proof
      - no order action side effect proof
    required_sections:
      - Acceptance Proof
      - What This PR Does Not Prove
  tests:
    path_patterns:
      - "tests/**"
      - "testing/**"
      - "fixtures/**"
    required_proof:
      - test proves behavior
      - no test weakening
      - negative-path proof
  docs:
    path_patterns:
      - "docs/**"
      - "*.md"
      - "RUNBOOK*.md"
      - "AGENTS.md"
    required_proof:
      - no runtime claims
      - scope is explicit
      - future runtime proof stated if relevant
  config:
    path_patterns:
      - "config/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/**"
    required_proof:
      - config validation proof
      - dependency impact proof
      - no accidental live behavior change

required_default_commands:
  - python -m pytest
  - python -m compileall .
  - python scripts/verify_journal_contract.py
  - python scripts/verify_reducer_replay.py
  - python scripts/verify_paper_live_boundary.py
  - python scripts/verify_acceptance_evidence.py

future_enforcement:
  validator_cli_pr: 38
  scope_guard_ci_pr: 39
  changed_file_classifier_pr: 35
