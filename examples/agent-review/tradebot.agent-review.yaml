schema_version: "1.0"
profile: tradebot

metadata:
  product: Tradebot
  category: Trading System Agent Review Adapter
  purpose: Provide a starter Agent Review config for deterministic trading-system repositories that require strict paper/live boundaries, data freshness proof, risk proof, and evidence-backed executable claims.

required_sections:
  - Agent Work Contract
  - Grill Me Review
  - Hermes Review
  - GSD Review
  - Security Review
  - QA / Failure Review
  - Scope Guard
  - Acceptance Proof
  - Runtime Proof Required After Merge
  - What This PR Does Not Prove
  - Human Approval

required_evidence_contract_fields:
  - mode
  - candidate_id
  - decision
  - reason
  - is_runtime_change
  - is_security_runtime_change
  - child_mcp_forwarding_changed
  - policy_behavior_changed
  - approval_behavior_changed
  - audit_schema_changed
  - source

optional_evidence_contract_fields:
  - trace_behavior_changed
  - scanner_behavior_changed
  - cli_behavior_changed
  - config_adapter_behavior_changed
  - release_behavior_changed
  - ci_behavior_changed

modes:
  DOCS_ONLY:
    runtime_changes_allowed: false
    product_tests_required: false
    must_state_no_runtime_claims: true
  CONTRACT_ONLY:
    runtime_changes_allowed: false
    product_tests_required: false
    must_state_future_runtime_proof: true
  RUNTIME_CHANGE:
    runtime_changes_allowed: true
    product_tests_required: true
    must_include_negative_tests: true
  SECURITY_RUNTIME_CHANGE:
    runtime_changes_allowed: true
    product_tests_required: true
    must_include_negative_tests: true
    must_include_false_positive_tests: true
    must_include_audit_or_debug_evidence: true

hard_rules:
  no_fake_progress: true
  no_unrelated_abstractions: true
  no_test_weakening: true
  no_scope_creep: true
  no_runtime_claims_from_docs_only_pr: true
  no_unreviewed_ci_changes: true
  no_unreviewed_release_changes: true
  no_live_behavior_without_explicit_scope: true
  no_broker_adapter_change_without_explicit_scope: true
  no_silent_fallback_for_market_data: true
  no_profitability_claim_without_evidence: true

runtime_safety_rules:
  fail_closed_on_invalid_config: true
  fail_closed_on_invalid_evidence: true
  fail_closed_on_missing_required_proof: true
  never_hide_validation_failures: true
  never_claim_runtime_safety_without_tests: true
  stale_feed_must_fail_closed: true
  strict_paper_live_boundary_required: true
  risk_rejection_must_be_explicit: true
  execution_claims_require_acceptance_proof: true

area_rules:
  strategy:
    path_patterns:
      - "strategies/**"
      - "core/strategy/**"
      - "ml/**"
      - "models/**"
      - "rl/**"
    required_proof:
      - strategy behavior proof
      - backtest or replay proof
      - no profitability claim without evidence
      - failure-path proof
    required_sections:
      - QA / Failure Review
      - Scope Guard
      - Acceptance Proof
  risk:
    path_patterns:
      - "core/risk/**"
      - "core/gating/**"
      - "core/*risk*.py"
      - "core/*gate*.py"
      - "config/risk*.py"
    required_proof:
      - risk rejection proof
      - fail-closed proof
      - boundary-condition proof
      - no test weakening
    required_sections:
      - Security Review
      - QA / Failure Review
      - Acceptance Proof
  market_data:
    path_patterns:
      - "core/feed/**"
      - "core/market_data/**"
      - "core/*feed*.py"
      - "core/*depth*.py"
      - "data/**"
    required_proof:
      - stale-feed proof
      - missing-data proof
      - fail-closed proof
    required_sections:
      - QA / Failure Review
      - Scope Guard
  execution:
    path_patterns:
      - "core/execution/**"
      - "core/broker/**"
      - "core/*execution*.py"
      - "core/*order*.py"
    required_proof:
      - paper-live boundary proof
      - no live order path without explicit scope
      - idempotency or duplicate-order proof
      - failure-path proof
    required_sections:
      - Security Review
      - QA / Failure Review
      - Human Approval
  tests:
    path_patterns:
      - "tests/**"
      - "testing/**"
      - "fixtures/**"
    required_proof:
      - test proves behavior
      - no test weakening
      - negative-path proof
  docs:
    path_patterns:
      - "docs/**"
      - "*.md"
      - "RUNBOOK*.md"
      - "AGENTS.md"
    required_proof:
      - no runtime claims
      - scope is explicit
      - future runtime proof stated if relevant
  config:
    path_patterns:
      - "config/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/**"
    required_proof:
      - config validation proof
      - dependency impact proof
      - no accidental live behavior change

review_agents:
  scope_lock:
    label: Scope Lock Agent
    required_for:
      - docs
      - config
    required_sections:
      - Scope Guard
    required_proof:
      - scope is explicit
  evidence_replay:
    label: Evidence / Replay Agent
    required_for:
      - strategy
    required_sections:
      - Acceptance Proof
    required_proof:
      - backtest or replay proof
      - no profitability claim without evidence
  qa_failure:
    label: QA Failure Agent
    required_for:
      - strategy
      - risk
      - market_data
      - execution
      - tests
    required_sections:
      - QA / Failure Review
    required_proof:
      - failure-path proof
      - negative-path proof
  gsd:
    label: GSD Reviewer
    required_for:
      - strategy
    required_sections:
      - GSD Review
    required_proof:
      - not fake progress
  risk_gating:
    label: Risk / Gating Agent
    required_for:
      - risk
    required_sections:
      - Security Review
      - QA / Failure Review
    required_proof:
      - risk rejection proof
      - fail-closed proof
  safety_boundary:
    label: Safety Boundary Agent
    required_for:
      - risk
    required_sections:
      - Security Review
    required_proof:
      - boundary-condition proof
      - fail-closed proof
  security_review:
    label: Security Review Agent
    required_for:
      - risk
      - execution
    required_sections:
      - Security Review
    required_proof:
      - no live order path without explicit scope
  data_freshness:
    label: Data Freshness Agent
    required_for:
      - market_data
    required_sections:
      - QA / Failure Review
    required_proof:
      - stale-feed proof
      - missing-data proof
  runtime_boundary:
    label: Runtime Boundary Agent
    required_for:
      - market_data
      - execution
    required_sections:
      - QA / Failure Review
      - Human Approval
    required_proof:
      - paper-live boundary proof
      - stale-feed proof
  execution_boundary:
    label: Execution Boundary Agent
    required_for:
      - execution
    required_sections:
      - Security Review
      - Human Approval
    required_proof:
      - no live order path without explicit scope
      - idempotency or duplicate-order proof
  human_approval_gate:
    label: Human Approval Gate
    required_for:
      - execution
    required_sections:
      - Human Approval
    required_proof:
      - paper-live boundary proof
  no_test_weakening:
    label: No-Test-Weakening Agent
    required_for:
      - tests
    required_sections:
      - QA / Failure Review
    required_proof:
      - no test weakening
  docs_runbook:
    label: Docs / Runbook Agent
    required_for:
      - docs
    required_sections:
      - What This PR Does Not Prove
    required_proof:
      - no runtime claims
  ci_release_guard:
    label: CI / Release Guard Agent
    required_for:
      - config
    required_sections:
      - Scope Guard
    required_proof:
      - no accidental live behavior change

required_default_commands:
  - python -m pytest
  - python -m compileall .
  - python scripts/verify_runtime_safety.py
  - python scripts/verify_paper_live_boundary.py
  - python scripts/verify_evidence_bundle.py

future_enforcement:
  validator_cli_pr: 38
  scope_guard_ci_pr: 39
  changed_file_classifier_pr: 35
