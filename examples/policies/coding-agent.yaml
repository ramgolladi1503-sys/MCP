policy_version: "1.0"
default_action: allow

workspace_roots:
  - "./demo-workspace"

blocked_paths:
  - ".env"
  - "*.pem"
  - "*.key"
  - "credentials.json"
  - ".ssh/*"
  - ".aws/*"
  - ".npmrc"

allowed_path_exceptions:
  - ".env.example"

blocked_commands:
  - "rm -rf*"
  - "sudo*"
  - "chmod 777*"
  - "curl *--data*"
  - "wget *--post-data*"
  - "scp*"
  - "ssh*"

approval_required:
  - "git push*"
  - "git reset --hard*"
  - "npm install*"
  - "pip install*"
  - "docker build*"
  - "docker run*"

allowed_domains:
  - "github.com"
  - "api.github.com"

deny_unknown_domains: true

feature_flags:
  scanner: true
  gateway: true
  response_inspector: false
  resource_prompt_inspector: false
  manifest_drift: false
  tamper_evident_audit: true
  approval_prompt: false
  config_rewrite: false
