schema_version: "1.0"
profile: enterprise_agent_firewall

metadata:
  product: MCP Shield
  category: Enterprise Agent Firewall
  purpose: Enforce PR evidence expectations for MCP Shield enterprise-grade development.

required_sections:
  - Agent Work Contract
  - Grill Me Review
  - Hermes Review
  - GSD Review
  - Security Review
  - QA / Failure Review
  - Scope Guard
  - Acceptance Proof
  - Runtime Proof Required After Merge
  - What This PR Does Not Prove
  - Human Approval

required_evidence_contract_fields:
  - mode
  - candidate_id
  - decision
  - reason
  - is_runtime_change
  - is_security_runtime_change
  - child_mcp_forwarding_changed
  - policy_behavior_changed
  - approval_behavior_changed
  - audit_schema_changed
  - source

optional_evidence_contract_fields:
  - trace_behavior_changed
  - scanner_behavior_changed
  - cli_behavior_changed
  - config_adapter_behavior_changed
  - release_behavior_changed
  - ci_behavior_changed

modes:
  DOCS_ONLY:
    runtime_changes_allowed: false
    product_tests_required: false
    must_state_no_runtime_claims: true
  CONTRACT_ONLY:
    runtime_changes_allowed: false
    product_tests_required: false
    must_state_future_runtime_proof: true
  RUNTIME_CHANGE:
    runtime_changes_allowed: true
    product_tests_required: true
    must_include_negative_tests: true
  SECURITY_RUNTIME_CHANGE:
    runtime_changes_allowed: true
    product_tests_required: true
    must_include_negative_tests: true
    must_include_false_positive_tests: true
    must_include_audit_or_debug_evidence: true

hard_rules:
  no_pr_loop_cosmetic_work: true
  no_fake_progress: true
  no_unrelated_abstractions: true
  no_test_weakening: true
  no_broad_refactor_inside_scoped_pr: true
  no_runtime_claims_from_docs_only_pr: true
  no_cloud_saas_until_local_enterprise_v1: true
  no_billing_until_local_enterprise_v1: true
  no_auth_until_scoped_enterprise_wave: true
  no_dashboard_before_observability_contracts: true
  no_agent_auto_merge: true
  no_agent_auto_fix: true

runtime_safety_rules:
  fail_closed_on_malformed_policy: true
  fail_closed_on_malformed_tool_calls: true
  fail_closed_on_unknown_critical_tool_identity: true
  fail_closed_on_missing_required_approval: true
  fail_closed_on_approval_hash_mismatch: true
  never_log_secrets_before_redaction: true
  never_pollute_mcp_stdio_stdout: true
  never_forward_blocked_calls: true
  never_silently_downgrade_block_to_warn: true
  never_allow_unknown_external_egress_when_denied_by_policy: true
  never_trust_tool_schema_drift_without_review: true
  never_hide_security_audit_append_failures: true

area_rules:
  gateway:
    path_patterns:
      - "packages/gateway/**"
    required_proof:
      - protocol test
      - stdout purity
      - block before forward proof
      - timeout behavior
    required_sections:
      - Security Review
      - QA / Failure Review
      - Scope Guard
  policy:
    path_patterns:
      - "packages/policy/**"
    required_proof:
      - mode matrix
      - fail-closed test
      - false-positive test
  audit:
    path_patterns:
      - "packages/audit/**"
    required_proof:
      - redaction test
      - hash-chain test
      - tamper or replay test
  approval:
    path_patterns:
      - "packages/gateway/src/approval.ts"
      - "packages/cli/src/approval-server.ts"
    required_proof:
      - create approval
      - approve
      - deny
      - expire
      - tamper
      - hash mismatch
  scanner:
    path_patterns:
      - "packages/scanner/**"
    required_proof:
      - attack corpus
      - false-positive corpus
  cli:
    path_patterns:
      - "packages/cli/**"
    required_proof:
      - built CLI smoke proof
  config_adapter:
    path_patterns:
      - "packages/config-adapter/**"
    required_proof:
      - backup proof
      - rewrite proof
      - rollback proof
      - disable proof
  observability:
    path_patterns:
      - "packages/**/observability/**"
      - "docs/OBSERVABILITY_DEBUGGING_ROADMAP.md"
    required_proof:
      - trace context proof
      - redaction proof
      - no protocol pollution proof
  release:
    path_patterns:
      - "scripts/release*"
      - ".github/workflows/**"
      - "package.json"
      - "packages/*/package.json"
    required_proof:
      - package or tarball proof
      - publish dry-run proof
      - no accidental real publish proof
  docs_only:
    path_patterns:
      - "docs/**"
      - "*.md"
    required_proof:
      - no runtime claims
      - scope is explicit
      - future runtime proof stated if relevant

required_default_commands:
  - pnpm install --frozen-lockfile
  - pnpm build
  - pnpm typecheck
  - pnpm lint
  - pnpm test:hardening
  - pnpm release:dry-run

future_enforcement:
  validator_cli_pr: 29
  scope_guard_ci_pr: 32
  changed_file_classifier_pr: 33
